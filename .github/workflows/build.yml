name: Build FreeLinX Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3 git curl tar

    - name: Build Toolchain
      run: |
        echo "Building toolchain portably..."
        mkdir -p bin include lib
        # Burada əsl LLVM/Clang kompilyasiya skriptiniz və ya yığma əmrləriniz olacaq
        # Test məqsədilə portable stubs/binaries yaradılır
        echo "int main() {}" > test.c
        gcc test.c -o bin/freelinix-cc

    - name: Package Toolchain
      run: |
        tar -czvf freelinix-toolchain-x86_64.tar.gz bin/ include/ lib/

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: freelinix-toolchain
        path: freelinix-toolchain-x86_64.tar.gz
