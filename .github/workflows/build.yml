name: Build FreeLinX Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3 git tar

    - name: Build Real LLVM/Clang (Portable - GLIBC 2.35)
      run: |
        git clone --depth 1 --branch llvmorg-18.1.8 https://github.com/llvm/llvm-project.git llvm-project-src
        mkdir -p llvm-build && cd llvm-build
        cmake -G Ninja ../llvm-project-src/llvm \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_TARGETS_TO_BUILD="X86" \
          -DBUILD_SHARED_LIBS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF
        ninja clang lld

    - name: Package Toolchain
      run: |
        mkdir -p toolchain/bin toolchain/include toolchain/lib
        cp llvm-build/bin/clang toolchain/bin/
        cp llvm-build/bin/clang++ toolchain/bin/
        cp llvm-build/bin/ld.lld toolchain/bin/
        ln -sf clang toolchain/bin/freelinix-cc
        ln -sf clang++ toolchain/bin/freelinix-c++

        cat << 'EOT' > toolchain/env.sh
        export PATH="$(dirname "${BASH_SOURCE[0]}")/bin:$PATH"
        EOT

        tar -czvf freelinix-toolchain-x86_64.tar.gz toolchain/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: freelinix-toolchain
        path: freelinix-toolchain-x86_64.tar.gz
