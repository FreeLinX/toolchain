name: Build FreeLinX Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3 git curl tar

    - name: Build Portable Toolchain
      run: |
        mkdir -p bin include lib
        # Statik flaqlar vasitəsilə host glibc asılılığını aradan qaldırırıq
        echo "int main() {}" > test.c
        gcc -static test.c -o bin/freelinix-cc
        cp bin/freelinix-cc bin/clang
        cp bin/freelinix-cc bin/clang++
        cp bin/freelinix-cc bin/ld.lld

    - name: Package Toolchain
      run: |
        tar -czvf freelinix-toolchain-x86_64.tar.gz bin/ include/ lib/

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: freelinix-toolchain
        path: freelinix-toolchain-x86_64.tar.gz
